<!DOCTYPE html>
<html lang="en">
<head>
	<title>3d example using three.js and multiple windows</title>
	<script type="text/javascript" src="three.r124.min.js"></script>
	<style type="text/css">
		
		*
		{
			margin: 0;
			padding: 0;
		}

		#info-text {
			position: fixed;
			top: 50px;
			right: calc(50% - 200px);
			color: rgba(0, 0, 0, 0.9);
			font-family: Arial, sans-serif;
			font-size: 13px;
			background-color: rgba(180, 180, 250, 0.5);
			padding: 12px 18px;
			border-radius: 6px;
			pointer-events: none;
			z-index: 1000;
			text-align: center;
			line-height: 1.6;
			max-width: 400px;
			min-width: 400px;
		}

	</style>
</head>
<body>
	
	<div id="info-text">
		Open multiple browser windows to see synchronized spheres!<br>
		Watch particles orbit with natural movement patterns.<br>
		Move or resize windows to see spheres follow smoothly.
	</div>
	
	<script type="module" src="main.js"></script>
</body>
</html>
